
questions:
  - text: >
      Does continual processing in neurons lead to the feeling of
      “experience”, as opposed to discrete tokens
      in language models?

  - text: >
      Are neural organoids, particularly those given
      training data, sentient? Are they able to solve
      problems LLMs can’t? How would inference and
      verification work on biological compute?

  - text: >
      Will ephaptic coupling ever be a phenomenon we can leverage? 

  - text: > 
      How can we use existing sequencing to study more local relationships in proteins, DNA, and RNA? What relationships are missed by standard bioinformatics pipelines?

