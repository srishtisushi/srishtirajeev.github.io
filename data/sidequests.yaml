  cover: "images/sidequests/covers/hackathons.webp"
  photos:
    - image: "images/sidequests/hackathons + gatherings/epihack.jpeg"
      caption: "EpiHack 2026; Spent 5 days with public health professionals from Pima/Maricopa County and engineers to help design a [mobile app](https://github.com/Ending-Pandemics/epihack) to track and prevent the spread of infectious diseases here in Arizona."

    - image: "images/sidequests/hackathons + gatherings/rabbitholeathon.jpg"
      caption: "[Rabbitholeathon 5.0](https://www.rabbitholeathon.com/); Spent a weekend exploring various questions (rabbitholes) about our future (determinism, AI ethics, sustainable design, and more) with some really cool founders and people!"
    - image: "images/sidequests/hackathons + gatherings/spaceout.jpg"
      caption: "Got the chance to work with astronauts, NASA, and the ESA to pitch a novel EEG monitoring system for astronauts. Our team won a special award and funding. Hosted by Geneva Digital Health Hub in 2024."

    - image: "images/sidequests/hackathons + gatherings/uspaa.jpg"
      caption: "Stamps Scholar representative to Camp USPAA 2026 at UNC - Charlotte. Met with fellow scholars from various institutions to discuss how to improve scholarship programs, community service efforts, and engage with policy at our home institutions (and again, met some really cool folks!)."


